name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        env:
          NODE_ENV: test
          MONGODB_URL: mongodb://localhost:27017/TestDB
          REDIS_ENABLED: true
          REDIS_URL: redis://localhost:6379
          REDIS_KEY_PREFIX: bc_api_test
          ACCESS_TOKEN_SECRET: test_access_secret_32_bytes_long_key_string
          REFRESH_TOKEN_SECRET: test_refresh_secret_32_bytes_long_key_string
          CLOUDINARY_CLOUD_NAME: test_cloud
          CLOUDINARY_API_KEY: test_key
          CLOUDINARY_API_SECRET: test_secret
        run: npm test

      - name: Build Docker Container
        run: docker build -t job-posting-backend:ci .
