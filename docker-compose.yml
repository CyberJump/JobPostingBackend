services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - REDIS_KEY_PREFIX=bc_api
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
